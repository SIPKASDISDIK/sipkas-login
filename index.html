<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login SIPKAS</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef3f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 4px 20px #0002;
      max-width: 420px;
      width: 90%;
    }
    h2 { color: #174477; }
  </style>
</head>

<body>
  <div class="box">
    <h2>LOGIN SIPKAS</h2>
    <p>Sistem Informasi Pengembalian Kas Daerah</p>
    <p>Silakan masuk menggunakan akun Google terdaftar.</p>

    <div id="g_id_onload"
      data-client_id="629719840579-frit730ktcv1u1sfc2ot9mu2raropkl7.apps.googleusercontent.com"
      data-callback="prosesLogin">
    </div>

    <div class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="signin_with"
      data-shape="rectangular">
    </div>

    <p id="status"></p>
  </div>

  <script>
    function prosesLogin(response) {
      document.getElementById("status").innerText =
        "Memeriksa akun SIPKAS...";

      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://script.google.com/macros/s/AKfycbzRRI4PZ4RV9gJsm2uGi5ijtpF5tFlKjdENgF8yTMz5yiklnp4Pk4P3g-jbEWW4R7Xa/exec";

      const input = document.createElement("input");
      input.type = "hidden";
      input.name = "credential";
      input.value = response.credential;

      form.appendChild(input);
      document.body.appendChild(form);
      form.submit();
    }
  </script>
</body>
</html>
